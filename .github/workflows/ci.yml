name: quality-checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-training.txt
      - run: ruff check src dashboard tests
      - run: pytest -q
      - run: docker build -f Dockerfile.api -t purchase-intent-api .
      - run: docker build -f Dockerfile.dashboard -t purchase-intent-dashboard .
